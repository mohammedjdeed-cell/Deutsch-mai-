<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-50 text-slate-800">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deutsch mit Mai – A1/A2 Grammatik</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DeutschMai">

  <!-- Tailwind CSS CDN & Custom CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-blue-100 selection:text-blue-900">

  <!-- Top Sticky Navigation -->
  <header class="glass-nav sticky top-0 z-40 border-b border-slate-200">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black shadow-md shadow-blue-500/20">
          M
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-slate-900">Deutsch mit Mai</h1>
          <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider" id="level-indicator">A1 / A2 Intensiv</p>
        </div>
      </div>

      <!-- Stats Pill & Teacher Mode Trigger -->
      <div class="flex items-center space-x-2">
        <div class="flex items-center space-x-1.5 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full text-xs font-semibold text-amber-800">
          <svg class="w-3.5 h-3.5 fill-amber-500" viewBox="0 0 20 20">
            <path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/>
          </svg>
          <span id="stat-xp">0 XP</span>
        </div>

        <button id="teacher-toggle-btn" class="p-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-100 transition" title="Lehrer-Pult öffnen">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Topic & Level Filter Slider -->
    <div class="max-w-2xl mx-auto px-4 pb-2.5 flex items-center space-x-2 overflow-x-auto no-scrollbar text-xs">
      <button data-filter="all" class="filter-chip px-3 py-1 rounded-full font-medium whitespace-nowrap bg-blue-600 text-white shadow-sm shadow-blue-500/20">Alle Typen</button>
      <button data-filter="blitz" class="filter-chip px-3 py-1 rounded-full font-medium whitespace-nowrap bg-slate-150 bg-slate-100 text-slate-600 hover:bg-slate-200">Der / Die / Das</button>
      <button data-filter="cloze" class="filter-chip px-3 py-1 rounded-full font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200">Lückentext</button>
      <button data-filter="puzzle" class="filter-chip px-3 py-1 rounded-full font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200">Satzbau</button>
      <button data-filter="case" class="filter-chip px-3 py-1 rounded-full font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200">Kasus-Detektiv</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-between">
    
    <!-- Exercise Progress Bar -->
    <div class="mb-4">
      <div class="flex justify-between text-xs font-semibold text-slate-400 mb-1">
        <span id="exercise-type-tag">Aufgabe</span>
        <span id="exercise-counter">0 / 0</span>
      </div>
      <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-blue-600 transition-all duration-300 w-0"></div>
      </div>
    </div>

    <!-- Active Question Card Area -->
    <div id="exercise-stage" class="flex-1 flex flex-col justify-center items-center my-auto min-h-[300px]">
      <!-- Populated dynamically via app.js -->
    </div>

    <!-- Footer Feedback & Action Panel -->
    <div id="feedback-panel" class="hidden w-full mt-4 rounded-2xl p-4 border transition-all">
      <div class="flex items-start justify-between">
        <div class="flex items-start space-x-3">
          <div id="feedback-icon" class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 mt-0.5"></div>
          <div>
            <h3 id="feedback-title" class="font-bold text-sm"></h3>
            <p id="feedback-explanation" class="text-xs mt-1 text-slate-600 leading-relaxed"></p>
          </div>
        </div>
        <button id="btn-audio-repeat" class="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100" title="Audio abspielen">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M6 10H4a1 1 0 00-1 1v2a1 1 0 001 1h2l5 5V4L6 10z"/>
          </svg>
        </button>
      </div>
      <button id="btn-next" class="mt-4 w-full py-3 bg-slate-900 text-white rounded-xl font-semibold text-sm shadow-md hover:bg-slate-800 transition">
        Weiter
      </button>
    </div>

  </main>

  <!-- Teacher View Modal (Hidden by Default) -->
  <aside id="teacher-modal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl flex flex-col max-h-[85vh] overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <div>
          <h2 class="font-bold text-base text-slate-900">Lehrkraft-Pult (Curriculum Inspector)</h2>
          <p class="text-xs text-slate-500">Lösungen einsehen & Hausaufgaben-Links erstellen</p>
        </div>
        <button id="close-teacher-modal" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-4 overflow-y-auto space-y-3 flex-1 text-xs" id="teacher-curriculum-list">
        <!-- Injected via app.js -->
      </div>
      <div class="p-4 border-t border-slate-200 bg-slate-50 flex flex-col gap-2">
        <button id="btn-export-link" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition text-xs flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          Gefilterte Aufgaben als Übungs-URL kopieren
        </button>
        <p id="export-confirm" class="text-center text-[10px] text-green-600 font-semibold hidden">In die Zwischenablage kopiert!</p>
      </div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
